name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: 빌드·테스트 (-Xlint:all -Werror, javadoc doclint, 생성 코드 검사 포함)
        run: ./gradlew --no-daemon clean build

  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: 생성 코드(모델·리소스·파라미터·웹훅 파서)가 spec과 일치하는지
        run: ./gradlew --no-daemon checkGeneratedModels

  audit:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: gradle.lockfile이 build.gradle과 일치하는지
        run: ./gradlew --no-daemon resolveAndLockAll --write-locks && git diff --exit-code gradle.lockfile testing/gradle.lockfile opentelemetry/gradle.lockfile
      - name: buildSrc/gradle.lockfile이 buildSrc/build.gradle과 일치하는지
        run: ./gradlew --no-daemon -p buildSrc resolveAndLockAll --write-locks && git diff --exit-code buildSrc/gradle.lockfile
      - name: 의존성 취약점 검사 (osv-scanner, 비밀값 불필요)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=gradle.lockfile --lockfile=testing/gradle.lockfile --lockfile=opentelemetry/gradle.lockfile --lockfile=buildSrc/gradle.lockfile
      - name: 런타임 의존성 목록
        run: ./gradlew --no-daemon -q dependencies --configuration runtimeClasspath   # 코어: jackson-databind만

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (전체 히스토리)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
