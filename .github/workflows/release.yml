# v* 태그를 push하면 서명된 아티팩트를 Maven Central(Central Portal)에 올립니다.
#
# 저장소에 비밀값을 두지 않습니다. 모든 자격 증명은 GitHub Environment "maven-central"의 secret으로만 주입합니다.
# 사전 설정 (저장소 관리자):
#   1. Settings > Environments > New environment "maven-central"
#      - Required reviewers: 배포 승인자 지정 (승인 전에는 아래 publish job이 secret에 접근할 수 없음)
#      - Deployment branches and tags: "Selected" > tag 패턴 v*
#   2. 같은 Environment에 secret 4개 등록 (Repository secret이 아니라 Environment secret)
#      - CENTRAL_USERNAME   Central Portal(https://central.sonatype.com) > Account > Generate User Token 의 username
#      - CENTRAL_PASSWORD   같은 User Token 의 password
#      - SIGNING_KEY        배포 전용 OpenPGP 비밀키 (ASCII armor, `gpg --armor --export-secret-keys <KEYID>`)
#      - SIGNING_PASSWORD   그 비밀키의 passphrase
#      공개키는 keys.openpgp.org 등 키서버에 올려 둡니다 (Central이 서명을 검증).
#   3. Central Portal에서 namespace io.github.icomm-api 가 검증되어 있어야 합니다.
#
# 업로드는 publishingType=USER_MANAGED 로 합니다: Portal에서 검증 결과를 확인한 뒤 사람이 "Publish"를 눌러야 공개됩니다.
name: release

on:
  push:
    tags: ["v*"]
  # 재실행용: Actions > release > Run workflow 에서 "Use workflow from"을 v* 태그로 고릅니다.
  # 브랜치에서 실행하면 버전 검사와 maven-central environment(태그 v*만 허용)에서 막힙니다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: 태그와 프로젝트 버전이 같은지
        run: |
          version=$(./gradlew --no-daemon -q properties | sed -n 's/^version: //p')
          test "v${version}" = "${GITHUB_REF_NAME}"
          grep -q "VERSION = \"${version}\"" src/main/java/io/github/icommapi/bizgo/Bizgo.java
      - name: 빌드·테스트
        run: ./gradlew --no-daemon clean build

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: 서명 키 진단 (값은 출력하지 않음)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gpg --version | head -n 1
          echo "헤더:"; printf '%s' "$SIGNING_KEY" | head -c 40 | head -n 1   # 기대값 -----BEGIN PGP PRIVATE KEY BLOCK-----
          echo "줄 수: $(printf '%s' "$SIGNING_KEY" | wc -l)"                  # 0이면 개행 유실
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          echo "보호 방식:"; printf '%s' "$SIGNING_KEY" | gpg --list-packets 2>/dev/null | grep -Ei 'version|protect|s2k|aead|ocb' | sort -u || true
          # passphrase 확인: 파이프(fd)로만 전달하고 서명 결과는 버립니다.
          echo test | gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$SIGNING_PASSWORD")             --clearsign >/dev/null && echo "passphrase OK" || echo "passphrase로 서명 실패" >&2
      - name: 서명하고 로컬 staging 디렉터리에 게시
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # 서명 키가 없으면 실패합니다(서명 없는 산출물을 배포하지 않음). build.gradle도 같은 검사를 합니다.
          test -n "${SIGNING_KEY}" || { echo "SIGNING_KEY secret이 없습니다" >&2; exit 1; }
          ./gradlew --no-daemon --stacktrace clean publishAllPublicationsToStagingRepository   # 코어 + testing + opentelemetry
      - name: 번들 만들기
        run: |
          cd build/staging-deploy
          find . -name 'maven-metadata*' -delete
          zip -qr ../central-bundle.zip .
          unzip -l ../central-bundle.zip
      - name: Central Portal에 업로드 (USER_MANAGED)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::${token}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${token}" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=bizgo-sdk-comm-java-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
